{% extends 'base.html' %}{% block content %}<section class='card'><h1>حوكمة المراجع</h1>{% for p in proposals %}<div class='row'><span><b>{{p.reference.name}}</b><small>بواسطة {{p.submitter.username}}</small></span><span><form method='post' action='/governance/{{p.pk}}/approve/' class='inline'>{% csrf_token %}<button>قبول</button></form><form method='post' action='/governance/{{p.pk}}/reject/' class='inline'>{% csrf_token %}<button class='danger'>رفض</button></form></span></div>{% empty %}<p class='muted'>لا توجد طلبات معلقة.</p>{% endfor %}</section>{% endblock %}
